name: Code Review (AI Agent)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  static-review:
    name: Static Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run static review
        run: bash .github/scripts/static-review.sh > /tmp/static-review.md 2>&1 || true

      - name: Upload static review
        uses: actions/upload-artifact@v4
        with:
          name: static-review
          path: /tmp/static-review.md

  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    needs: static-review
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download static review
        uses: actions/download-artifact@v4
        with:
          name: static-review
          path: /tmp

      - name: Run AI review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bash .github/scripts/ai-review.sh /tmp/static-review.md

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/review-comment.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Code Review — AI Agent')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Check verdict
        run: |
          if grep -q "Veredicto: ❌ FAIL" /tmp/review-comment.md; then
            echo "::error::Code review found critical issues"
            exit 1
          fi
          echo "Code review passed (no critical issues)"
