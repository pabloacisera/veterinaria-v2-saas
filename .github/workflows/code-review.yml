name: Code Review (AI Agent)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  static-review:
    name: Static Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run static review
        id: static
        run: |
          bash .github/scripts/static-review.sh 2>&1 | tee /tmp/static-review.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload static review artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-review
          path: /tmp/static-review.md

  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    needs: static-review
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download static review
        uses: actions/download-artifact@v4
        with:
          name: static-review
          path: /tmp

      - name: Generate AI review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          DIFF=$(git diff main...HEAD --stat)
          DIFF_FULL=$(git diff main...HEAD)
          STATIC_REVIEW=$(cat /tmp/static-review.md)

          # Truncate diff if too large (Groq context limit)
          MAX_DIFF=12000
          if [ ${#DIFF_FULL} -gt $MAX_DIFF ]; then
            DIFF_FULL="${DIFF_FULL:0:$MAX_DIFF}

          [truncated — diff was ${#DIFF_FULL} chars total]"
          fi

          # Read project specs (truncated to relevant sections)
          SPECS=""
          if [ -f ".agent/SPECS.md" ]; then
            SPECS=$(head -c 8000 .agent/SPECS.md)
          fi
          SKILLS=""
          if [ -f ".agent/SKILLS.md" ]; then
            SKILLS=$(head -c 4000 .agent/SKILLS.md)
          fi

          # Build the review prompt
          PROMPT="You are a code reviewer for a veterinary SaaS platform (Veterinaria V2).

PROJECT RULES (from SPECS.md):
$SPECS

CODE CONVENTIONS (from SKILLS.md):
$SKILLS

STATIC REVIEW RESULTS:
$STATIC_REVIEW

GIT DIFF:
\`\`\`diff
$DIFF_FULL
\`\`\`

Analyze the diff and static review results. Check for:
1. Architecture violations (Clean Architecture, Feature-Sliced Design)
2. Security issues (hardcoded secrets, injection, exposed endpoints)
3. Logic bugs or anti-patterns
4. Missing error handling
5. Convention violations (UUIDv7, soft-delete, RLS, naming)
6. Dependency issues (unnecessary or missing)
7. Migration safety (destructive operations)
8. Test adequacy

Respond in SPANISH. Format as markdown with these sections:
### ✅ Aprobado (lo que está bien)
### ⚠️ Advertencias (cosas a mejorar)
### ❌ Errores (cosas que se deben corregir)
### 💡 Sugerencias (mejoras opcionales)

### Veredicto: PASS o FAIL (si hay errores críticos)"

          # Call Groq API
          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg model "llama-3.1-70b-versatile" \
              --arg prompt "$PROMPT" \
              '{
                model: $model,
                messages: [{role: "user", content: $prompt}],
                temperature: 0.3,
                max_tokens: 2000
              }')")

          AI_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "Error: No response from AI"')

          # Build final comment
          cat > /tmp/review-comment.md << 'REVIEW_EOF'
          ## 🤖 Code Review — AI Agent

          REVIEW_EOF

          cat /tmp/static-review.md >> /tmp/review-comment.md
          echo "" >> /tmp/review-comment.md
          echo "## 🧠 AI Analysis" >> /tmp/review-comment.md
          echo "" >> /tmp/review-comment.md
          echo "$AI_CONTENT" >> /tmp/review-comment.md
          echo "" >> /tmp/review-comment.md
          echo "---" >> /tmp/review-comment.md
          echo "*Generated by code-review-agent • Model: llama-3.1-70b-versatile via Groq*" >> /tmp/review-comment.md

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/review-comment.md', 'utf8');

            // Find existing bot comment to update (avoid spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Code Review — AI Agent')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Check verdict
        run: |
          if grep -q "Veredicto: ❌ FAIL" /tmp/review-comment.md; then
            echo "::error::Code review found critical issues"
            exit 1
          fi
          echo "Code review passed (no critical issues)"
