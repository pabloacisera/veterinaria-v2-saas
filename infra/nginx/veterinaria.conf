# Veterinaria V2 — Nginx config para produccion
# Copiar a: /home/ec2-user/global/nginx/conf.d/veterinaria.conf
#
# Este archivo se carga automaticamente por Nginx global.
# Nginx escucha en puerto 81 (host) y enruta por server_name.

server {
    listen 80;
    server_name veterinaria.artisandevs.site;

    # Headers de seguridad (mismos que Caddy tenia)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' res.cloudinary.com data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API → Backend (FastAPI en puerto 4001)
    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend → Archivos estaticos (React SPA)
    location / {
        root /opt/veter.v2/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estaticos (JS, CSS, imagenes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /opt/veter.v2/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' res.cloudinary.com data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Healthcheck del backend (opcional, para monitoreo)
    location /health {
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
    }
}
