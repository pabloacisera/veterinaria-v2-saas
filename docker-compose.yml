services:
  core_db:
    image: pgvector/pgvector:pg16
    container_name: vet-core-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: veterinaria_v2
      POSTGRES_PASSWORD: YOUR_DB_PASSWORD
      POSTGRES_DB: core_db
    ports:
      - "5444:5432"
    volumes:
      - core_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veterinaria_v2 -d core_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  community_db:
    image: postgres:16
    container_name: vet-community-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: veterinaria_v2
      POSTGRES_PASSWORD: YOUR_DB_PASSWORD
      POSTGRES_DB: community_db
    ports:
      - "5435:5432"
    volumes:
      - community_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veterinaria_v2 -d community_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: vet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vet-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: veterinaria_v2
      RABBITMQ_DEFAULT_PASS: YOUR_DB_PASSWORD
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  caddy:
    image: caddy:2-alpine
    container_name: vet-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - frontend_dist:/www
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    profiles:
      - production
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  backend:
    build: ./backend
    container_name: vet-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      core_db:
        condition: service_healthy
      community_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    profiles:
      - production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build: ./frontend
    container_name: vet-frontend
    restart: "no"
    volumes:
      - frontend_dist:/app/dist
    profiles:
      - production
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    container_name: vet-cloudflared
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  core_db_data:
  community_db_data:
  redis_data:
  rabbitmq_data:
  caddy_data:
  frontend_dist:
